# ═══════════════════════════════════════════════════════════════════════════════
# Ruff 配置(lint + format)
#
# 被 Makefile 的 lint/format 目标与 .husky/pre-commit、.husky/pre-push 调用。
# Ruff 同时承担 import 排序(isort)、格式化(替代 black)、静态检查(替代 flake8)。
# ═══════════════════════════════════════════════════════════════════════════════
[tool.ruff]
# 与运行环境保持一致,避免自动修复引入更高版本语法。
target-version = "py310"

# 行宽与 Frontend(prettier printWidth 100)统一。
line-length = 100

# 排除目录:虚拟环境、缓存、Django 自动生成的 migrations、入口脚本。
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*/migrations/*",
    "manage.py",
]

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",   # pycodestyle 语法错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes(未使用引用等)
    "I",   # isort(import 排序)
    "B",   # flake8-bugbear(常见 bug 模式)
    "UP",  # pyupgrade(旧语法升级)
    "DJ",  # flake8-django(Django 专用检查)
    "SIM", # flake8-simplify(代码简化建议)
    "C4",  # flake8-comprehensions(推导式优化)
]

ignore = [
    "E501",  # 行过长(交给 formatter 处理)
    "B008",  # 函数参数默认值中调用函数(DRF 常用模式,如 fields=serializers.X())
]

[tool.ruff.lint.per-file-ignores]
# settings 中允许 `from .base import *`(星号导入与未定义名引用)。
"Backend/settings/*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"   # 双引号
indent-style = "space"   # 空格缩进
