# {{ProjectChineseName}} 测试环境 Docker Compose 配置
#
# 占位符说明：
#   {{DOCKER_NAMESPACE}} - 镜像命名空间
#
# 环境变量说明：
#   使用 ${VAR:-default} 格式，支持通过环境变量覆盖默认值，可全局搜索替换
#   MYSQL_* - MySQL 数据库连接配置
#   REDIS_* - Redis 连接配置

name: {{DOCKER_NAMESPACE}}
services:
  django:
    image: registry.cn-hangzhou.aliyuncs.com/matrix-studio/{{DOCKER_NAMESPACE}}:test
    container_name: {{DOCKER_NAMESPACE}}-django
    command: sh django-entrypoint-test.sh
    networks:
      - {{DOCKER_NAMESPACE}}-net
    ports:
      - "{{test_django_port}}:8000"
    volumes:
      - ./log:/usr/local/var/log
      - ./media:/app/Backend/media
    environment:
      - MYSQL_HOST=${MYSQL_HOST:-test_mysql_host}
      - MYSQL_PORT=${MYSQL_PORT:-test_mysql_port}
      - MYSQL_NAME=${MYSQL_NAME:-test_mysql_name}
      - MYSQL_USER=${MYSQL_USER:-test_mysql_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-test_mysql_password}
      - REDIS_HOST=${REDIS_HOST:-test_redis_host}
      - REDIS_PORT=${REDIS_PORT:-test_redis_port}
      - REDIS_DB=${REDIS_DB:-test_redis_db}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-test_redis_password}
    restart: always

networks:
  {{DOCKER_NAMESPACE}}-net:
    driver: bridge
